<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>3×4 スライドパズル</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f7f7f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;overscroll-behavior:none}
.wrap{width:min(94vw,700px);margin:auto;padding:18px 0 34px}
h1{margin:0 0 8px;text-align:center;font-size:clamp(25px,6vw,38px);font-weight:900}
.lead{margin:0 0 10px;text-align:center;font-size:clamp(13px,3.4vw,18px);line-height:1.5;color:#555}
.top{display:flex;justify-content:flex-end;align-items:flex-end;gap:8px;margin:0 2px 10px}
.top b{font-size:14px;color:#555}
.preview{width:76px;aspect-ratio:3/4;object-fit:cover;border:2px solid #222;border-radius:7px;background:#fff}
.board{width:100%;aspect-ratio:3/4;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);border:3px solid #111;background:#fff;touch-action:none}
.slot{position:relative;overflow:hidden;border-right:3px solid #111;border-bottom:3px solid #111;background:#fff}
.slot:nth-child(3n){border-right:0}
.slot:nth-child(n+10){border-bottom:0}
.tile{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;will-change:transform;transition:transform .12s ease}
.tile.dragging{z-index:20;transition:none;cursor:grabbing;filter:brightness(.95)}
.tile:active{filter:brightness(.93)}
.tile img{position:absolute;width:300%;height:400%;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.blank{position:absolute;inset:0;background:#fff}
.retreat-row{display:flex;justify-content:flex-end}
.retreat{position:relative;width:33.333333%;aspect-ratio:1/1;background:#171717;border:3px solid #111;border-top:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:clamp(16px,4vw,22px);touch-action:none}
.retreat .tile{position:absolute;inset:0;background:#fff}
.retreat.has .label{display:none}
.status{margin:20px 0 14px;text-align:center;font-size:clamp(18px,4.5vw,26px);font-weight:900;min-height:1.5em}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:11px}
button{border:0;border-radius:15px;min-height:62px;font-size:clamp(17px,4vw,22px);font-weight:900}
#shuffle{background:#222;color:#fff}
#reset{background:#ddd;color:#222}
.hint{margin-top:10px;text-align:center;color:#666;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">

  const board=document.getElementById("board");
  const retreat=document.getElementById("retreat");
  const status=document.getElementById("status");

  let grid=[...Array(N).keys()];
  let reserve=null;
  let gesture=null;

  function adjacent(a,b){
    const ar=Math.floor(a/COLS), ac=a%COLS;
    const br=Math.floor(b/COLS), bc=b%COLS;
    return Math.abs(ar-br)+Math.abs(ac-bc)===1;
  }

  function makeTile(n){
    const tile=document.createElement("div");
    tile.className="tile";
    tile.dataset.tile=String(n);

    const im=document.createElement("img");
    im.src=PHOTO;
    const row=Math.floor(n/COLS);
    const col=n%COLS;
    im.style.left=(-col*100)+"%";
    im.style.top=(-row*100)+"%";
    tile.appendChild(im);
    return tile;
  }

  function solved(){
    return reserve===null && grid.every((v,i)=>v===i);
  }

  function render(){
    board.innerHTML="";
    grid.forEach((v,i)=>{
      const slot=document.createElement("div");
      slot.className="slot";
      slot.dataset.index=String(i);
      if(v===null){
        const blank=document.createElement("div");
        blank.className="blank";
        slot.appendChild(blank);
      } else {
        slot.appendChild(makeTile(v));
      }
      board.appendChild(slot);
    });

    retreat.querySelectorAll(".tile").forEach(el=>el.remove());
    if(reserve!==null){
      retreat.classList.add("has");
      retreat.appendChild(makeTile(reserve));
    } else {
      retreat.classList.remove("has");
    }

    status.textContent = solved()
      ? "完成！12枚すべてそろいました"
      : "完成形を見ながらそろえよう！";
  }

  function moveIndex(i){
    if(i<0 || i>=N || grid[i]===null) return false;

    const blank=grid.indexOf(null);

    // 退避マスが空なら、選んだ1枚を退避
    if(reserve===null){
      reserve=grid[i];
      grid[i]=null;
      render();
      return true;
    }

    // 盤面に空白がある場合は、隣接ピースだけ空白へ移動
    if(blank!==-1 && adjacent(i,blank)){
      grid[blank]=grid[i];
      grid[i]=null;
      render();
      return true;
    }
    return false;
  }

  function moveReserve(){
    const blank=grid.indexOf(null);
    if(reserve!==null && blank!==-1){
      grid[blank]=reserve;
      reserve=null;
      render();
      return true;
    }
    return false;
  }

  function targetIndexFromEvent(e){
    const slot=e.target.closest(".slot");
    return slot ? Number(slot.dataset.index) : -1;
  }

  // スライド操作のみ。タップでは動かさない。
  function startDrag(e, source){
    if(e.pointerType === "mouse" && e.button !== 0) return;

    let tile=null;
    let index=-1;

    if(source === "board"){
      const slot=e.target.closest(".slot");
      if(!slot) return;
      index=Number(slot.dataset.index);
      if(index<0 || grid[index]===null) return;
      tile=slot.querySelector(".tile");
    }else{
      if(reserve===null) return;
      tile=retreat.querySelector(".tile");
      if(!tile) return;
    }

    e.preventDefault();
    gesture={
      source, index, tile,
      x:e.clientX, y:e.clientY,
      dx:0, dy:0,
      pointerId:e.pointerId
    };
    tile.classList.add("dragging");
  }

  board.addEventListener("pointerdown", e=>startDrag(e,"board"));
  retreat.addEventListener("pointerdown", e=>startDrag(e,"retreat"));

  window.addEventListener("pointermove", e=>{
    if(!gesture || e.pointerId!==gesture.pointerId) return;
    e.preventDefault();

    gesture.dx=e.clientX-gesture.x;
    gesture.dy=e.clientY-gesture.y;

    if(gesture.source === "board"){
      // 盤面ピースは縦横どちらか一方向だけ追従させる
      if(Math.abs(gesture.dx) > Math.abs(gesture.dy)){
        gesture.tile.style.transform=`translate3d(${gesture.dx}px,0,0)`;
      }else{
        gesture.tile.style.transform=`translate3d(0,${gesture.dy}px,0)`;
      }
    }else{
      // 退避ピースは空白マスまで自由にドラッグできる
      gesture.tile.style.transform=`translate3d(${gesture.dx}px,${gesture.dy}px,0)`;
    }
  }, {passive:false});

  function finishDrag(e){
    if(!gesture || e.pointerId!==gesture.pointerId) return;
    const g=gesture;
    gesture=null;

    if(g.tile){
      g.tile.classList.remove("dragging");
      g.tile.style.transform="";
    }

    const blank=grid.indexOf(null);
    if(blank===-1) return;

    if(g.source === "board"){
      // 小さな指ブレでは動かさない
      if(Math.hypot(g.dx,g.dy)<14) return;

      let dest=g.index;
      if(Math.abs(g.dx)>Math.abs(g.dy)){
        const row=Math.floor(g.index/COLS);
        const col=g.index%COLS;
        if(g.dx>0 && col<COLS-1) dest=g.index+1;
        if(g.dx<0 && col>0) dest=g.index-1;
      }else{
        const row=Math.floor(g.index/COLS);
        if(g.dy>0 && row<ROWS-1) dest=g.index+COLS;
        if(g.dy<0 && row>0) dest=g.index-COLS;
      }

      if(dest===blank && adjacent(g.index,blank)){
        grid[blank]=grid[g.index];
        grid[g.index]=null;
        render();
      }
      return;
    }

    // 退避マスのピースは、空白マスの上までドラッグして離すと戻る
    const hit=document.elementFromPoint(e.clientX,e.clientY);
    const slot=hit && hit.closest ? hit.closest(".slot") : null;
    if(!slot) return;
    const dest=Number(slot.dataset.index);
    if(dest===blank && reserve!==null){
      grid[blank]=reserve;
      reserve=null;
      render();
    }
  }

  window.addEventListener("pointerup", finishDrag, {passive:false});
  window.addEventListener("pointercancel", e=>{
    if(!gesture || e.pointerId!==gesture.pointerId) return;
    if(gesture.tile){
      gesture.tile.classList.remove("dragging");
      gesture.tile.style.transform="";
    }
    gesture=null;
  });

  function shuffle(){
    grid=[...Array(N).keys()];
    reserve=null;

    // 必ず解けるように合法手だけで混ぜる
    let take=Math.floor(Math.random()*N);
    reserve=grid[take];
    grid[take]=null;

    let previous=-1;
    for(let k=0;k<300;k++){
      const blank=grid.indexOf(null);
      const r=Math.floor(blank/COLS), c=blank%COLS;
      let choices=[];
      if(r>0) choices.push(blank-COLS);
      if(r<ROWS-1) choices.push(blank+COLS);
      if(c>0) choices.push(blank-1);
      if(c<COLS-1) choices.push(blank+1);

      const filtered=choices.filter(x=>x!==previous);
      if(filtered.length) choices=filtered;

      const pick=choices[Math.floor(Math.random()*choices.length)];
      grid[blank]=grid[pick];
      grid[pick]=null;
      previous=blank;
    }
    render();
  }

  document.getElementById("shuffle").addEventListener("click",shuffle);
  document.getElementById("reset").addEventListener("click",()=>{
    grid=[...Array(N).keys()];
    reserve=null;
    render();
  });

  // ページを開いた時点で遊べる状態にする
  shuffle();
})();
</script>
