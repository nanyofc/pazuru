<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3×4 スライドパズル</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.wrap{width:min(94vw,720px);margin:auto;padding:22px 0 34px}
h1{margin:0 0 8px;text-align:center;font-size:clamp(26px,6vw,40px);font-weight:900}
.lead{margin:0 0 12px;text-align:center;line-height:1.5;color:#555;font-size:clamp(14px,3.5vw,19px)}
.sample-row{display:flex;justify-content:flex-end;align-items:flex-end;gap:9px;margin:0 2px 10px}
.sample-row b{font-size:14px;color:#555}
#preview{width:76px;aspect-ratio:3/4;object-fit:cover;border:2px solid #222;border-radius:7px;background:#fff}
.board{width:100%;aspect-ratio:3/4;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);border:3px solid #111;background:#fff}
.slot{position:relative;overflow:hidden;border-right:3px solid #111;border-bottom:3px solid #111;background:#fff}
.slot:nth-child(3n){border-right:0}
.slot:nth-child(n+10){border-bottom:0}
.tile{position:absolute;inset:0;overflow:hidden;cursor:pointer;touch-action:manipulation}
.tile img{position:absolute;width:300%;height:400%;max-width:none;object-fit:fill;pointer-events:none;user-select:none}
.retreat-row{display:flex;justify-content:flex-end}
.retreat{position:relative;width:33.333333%;aspect-ratio:1/1;background:#171717;border:3px solid #111;border-top:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:clamp(16px,4vw,22px)}
.retreat .tile{position:absolute;inset:0;background:#fff}
.retreat.has .label{display:none}
.status{text-align:center;font-weight:900;font-size:clamp(19px,4.8vw,28px);margin:22px 0 15px;min-height:1.5em}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;border-radius:16px;min-height:66px;font-size:clamp(17px,4vw,23px);font-weight:900}
#shuffle{background:#222;color:#fff}
#reset{background:#ddd;color:#222}
.hint{margin-top:10px;text-align:center;color:#777;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>3×4 スライドパズル</h1>
  <p class="lead">12枚のピースを並べ替えて完成させよう。<br>下の「退避マス」を使って動かせます。</p>

  <div class="sample-row"><b>完成形</b><img id="preview" alt="完成形"></div>

  <div id="board" class="board"></div>
  <div class="retreat-row"><div id="retreat" class="retreat"><span class="label">退避マス</span></div></div>

  <div id="status" class="status">完成！12枚すべてそろいました</div>

  <div class="buttons">
    <button id="shuffle">シャッフル</button>
    <button id="reset">完成形に戻す</button>
  </div>
  <div class="hint">ピースをタップして退避 → 空いたマスへ順番にスライド</div>
</div>

<script>
(() => {
  const COLS=3, ROWS=4, N=12;
  const board=document.getElementById('board');
  const retreat=document.getElementById('retreat');
  const status=document.getElementById('status');
  const source=document.getElementById('source');
  document.getElementById('preview').src=source.src;

  let grid=[...Array(N).keys()];
  let retreatTile=null;

  const adjacent=(a,b)=>{
    const ar=Math.floor(a/COLS), ac=a%COLS, br=Math.floor(b/COLS), bc=b%COLS;
    return Math.abs(ar-br)+Math.abs(ac-bc)===1;
  };

  function makeTile(n){
    const d=document.createElement('div');
    d.className='tile';
    const im=document.createElement('img');
    im.src=source.src;
    const r=Math.floor(n/COLS), c=n%COLS;
    im.style.left=(-c*100)+'%';
    im.style.top=(-r*100)+'%';
    d.appendChild(im);
    return d;
  }

  function solved(){
    return retreatTile===null && grid.every((v,i)=>v===i);
  }

  function render(){
    board.innerHTML='';
    grid.forEach((v,i)=>{
      const s=document.createElement('div');
      s.className='slot';
      if(v!==null){
        const t=makeTile(v);
        t.onclick=()=>tapGrid(i);
        s.appendChild(t);
      }
      board.appendChild(s);
    });

    retreat.querySelectorAll('.tile').forEach(x=>x.remove());
    if(retreatTile!==null){
      retreat.classList.add('has');
      const t=makeTile(retreatTile);
      t.onclick=tapRetreat;
      retreat.appendChild(t);
    } else retreat.classList.remove('has');

    status.textContent=solved() ? '完成！12枚すべてそろいました' : '完成形を見ながらそろえよう！';
  }

  function tapGrid(i){
    if(grid[i]===null) return;

    if(retreatTile===null){
      retreatTile=grid[i];
      grid[i]=null;
      render();
      return;
    }

    const blank=grid.indexOf(null);
    if(blank>=0 && adjacent(i,blank)){
      grid[blank]=grid[i];
      grid[i]=null;
      render();
    }
  }

  function tapRetreat(){
    const blank=grid.indexOf(null);
    if(blank>=0 && retreatTile!==null){
      grid[blank]=retreatTile;
      retreatTile=null;
      render();
    }
  }

  function shuffle(){
    grid=[...Array(N).keys()];
    retreatTile=null;

    // まず1枚を退避
    let take=Math.floor(Math.random()*N);
    retreatTile=grid[take];
    grid[take]=null;

    // 合法手だけで混ぜるので、必ず戻せる
    let prev=-1;
    for(let k=0;k<260;k++){
      const blank=grid.indexOf(null);
      const r=Math.floor(blank/COLS), c=blank%COLS;
      let opts=[];
      if(r>0) opts.push(blank-COLS);
      if(r<ROWS-1) opts.push(blank+COLS);
      if(c>0) opts.push(blank-1);
      if(c<COLS-1) opts.push(blank+1);
      const filtered=opts.filter(x=>x!==prev);
      if(filtered.length) opts=filtered;
      const pick=opts[Math.floor(Math.random()*opts.length)];
      grid[blank]=grid[pick];
      grid[pick]=null;
      prev=blank;
    }
    render();
  }

  document.getElementById('shuffle').onclick=shuffle;
  document.getElementById('reset').onclick=()=>{grid=[...Array(N).keys()];retreatTile=null;render()};

  render();
})();
</script>
</body>
</html>
