<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>9ピース＋退避マス スライドパズル</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #f4f4f4;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 22px 14px 42px;
  }
  .wrap {
    width: min(94vw, 480px);
    text-align: center;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 24px;
  }
  .lead {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.6;
    color: #555;
  }

  .answer-box {
    margin: 0 auto 16px;
    padding: 12px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.10);
  }
  .answer-title {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 800;
  }
  .answer-img {
    width: 100%;
    display: block;
    border-radius: 10px;
  }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    margin: 0 auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .slot {
    position: absolute;
    width: calc(100% / 3);
    height: calc(100% / 4);
    background: #181818;
    border: 2px solid #111;
  }

  .tile {
    position: absolute;
    width: calc(100% / 3);
    height: calc(100% / 4);
    border: 2px solid #111;
    background-repeat: no-repeat;
    background-size: 300% 300%;
    transition: transform .15s ease;
    touch-action: none;
    cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
  }

  .reserve-label {
    position: absolute;
    left: calc(100% / 3 * 2);
    top: calc(100% / 4 * 3);
    width: calc(100% / 3);
    height: calc(100% / 4);
    display: grid;
    place-items: center;
    pointer-events: none;
    font-weight: 800;
    font-size: 13px;
    color: rgba(255,255,255,.82);
    letter-spacing: .04em;
  }

  .board-outline {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 75%;
    border-radius: 14px;
    box-shadow: 0 10px 26px rgba(0,0,0,.14);
    pointer-events: none;
  }

  .status {
    min-height: 32px;
    margin: 16px 0 10px;
    font-size: 18px;
    font-weight: 800;
  }

  .controls {
    display: flex;
    gap: 10px;
  }

  button {
    flex: 1;
    border: 0;
    border-radius: 12px;
    padding: 14px 10px;
    font-size: 15px;
    font-weight: 800;
    background: #222;
    color: #fff;
  }
  button.sub {
    background: #dedede;
    color: #222;
  }

  .note {
    margin: 14px 0 0;
    font-size: 12px;
    line-height: 1.7;
    color: #777;
  }

  .complete {
    animation: pop .5s ease;
  }
  @keyframes pop {
    0% { transform: scale(.985); }
    55% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
<main class="wrap">

(() => {
  const stage = document.getElementById('stage');
  const status = document.getElementById('status');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const solveBtn = document.getElementById('solveBtn');

  // 位置0〜8 = 3×3、位置9 = 右下の下にある退避マス
  // piece 1〜9 = 画像ピース、0 = 空白
  const POS = [
    {r:0,c:0}, {r:0,c:1}, {r:0,c:2},
    {r:1,c:0}, {r:1,c:1}, {r:1,c:2},
    {r:2,c:0}, {r:2,c:1}, {r:2,c:2},
    {r:3,c:2}
  ];

  const goal = [1,2,3,4,5,6,7,8,9,0];
  let state = goal.slice();

  let pointerIndex = null;
  let startX = 0;
  let startY = 0;

  function adjacentPos(a,b) {
    const A = POS[a], B = POS[b];
    return Math.abs(A.r - B.r) + Math.abs(A.c - B.c) === 1;
  }

  function getValidMoves() {
    const blank = state.indexOf(0);
    const arr = [];
    for (let i=0;i<state.length;i++) {
      if (state[i] !== 0 && adjacentPos(i, blank)) arr.push(i);
    }
    return arr;
  }

  function move(index) {
    const blank = state.indexOf(0);
    if (!adjacentPos(index, blank)) return false;
    [state[index], state[blank]] = [state[blank], state[index]];
    render();
    checkComplete();
    return true;
  }

    const p = POS[posIndex];
    return `translate(${p.c * 100}%, ${p.r * 100}%)`;
  }

      tile.addEventListener('click', () => move(posIndex));

      tile.addEventListener('pointerdown', (e) => {
        pointerIndex = posIndex;
        startX = e.clientX;
        startY = e.clientY;
        try { tile.setPointerCapture(e.pointerId); } catch {}
      });

      tile.addEventListener('pointerup', (e) => {
        if (pointerIndex === null) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const threshold = 22;
        const blank = state.indexOf(0);

        if (Math.max(Math.abs(dx), Math.abs(dy)) < threshold) {
          pointerIndex = null;
          return;
        }

        const a = POS[pointerIndex];
        const b = POS[blank];

        let correctDirection = false;

        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 0 && b.r === a.r && b.c === a.c + 1) correctDirection = true;
          if (dx < 0 && b.r === a.r && b.c === a.c - 1) correctDirection = true;
        } else {
          if (dy > 0 && b.c === a.c && b.r === a.r + 1) correctDirection = true;
          if (dy < 0 && b.c === a.c && b.r === a.r - 1) correctDirection = true;
        }

        if (correctDirection) move(pointerIndex);
        pointerIndex = null;
      });

      tile.addEventListener('pointercancel', () => {
        pointerIndex = null;
      });

      stage.appendChild(tile);
    });

    const label = document.createElement('div');
    label.className = 'reserve-label';
    if (state[9] === 0) label.textContent = '退避マス';
    stage.appendChild(label);

  function isSolved() {
    return state.every((v,i) => v === goal[i]);
  }

  function checkComplete() {
    if (isSolved()) {
      status.textContent = '完成！ 9枚すべてそろいました';
      stage.classList.remove('complete');
      void stage.offsetWidth;
      stage.classList.add('complete');
    } else {
      status.textContent = '完成させてみよう！';
    }
  }

  function shuffle(steps=160) {
    state = goal.slice();
    let prevBlank = -1;

    for (let s=0;s<steps;s++) {
      const blank = state.indexOf(0);
      let moves = getValidMoves();
      moves = moves.filter(i => i !== prevBlank);
      if (!moves.length) moves = getValidMoves();

      const pick = moves[Math.floor(Math.random()*moves.length)];
      prevBlank = blank;
      [state[pick], state[blank]] = [state[blank], state[pick]];
    }

    if (isSolved()) return shuffle(steps + 20);
    render();
    checkComplete();
  }

  shuffleBtn.addEventListener('click', () => shuffle());

  solveBtn.addEventListener('click', () => {
    state = goal.slice();
    render();
    checkComplete();
  });

  render();
  shuffle();
})();
</script>
</body>
</html>
